.m-raw { font-family: var(--mono); font-size: 0.9em; }

  overflow: auto; max-height: 28em; tab-size: 2; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
pre.lean .ln { display: block; text-indent: -3ch; }
pre.lean .k { color: var(--lean-kw); font-weight: 600; }
pre.lean .t { color: var(--lean-type); }
pre.lean .u { color: var(--lean-num); }
pre.lean .c { color: var(--lean-com); font-style: italic; }
pre.lean .d { color: var(--lean-name); font-weight: 600; }
.decl .more { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.decl .more:hover { color: var(--accent-ink); }
.links { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 22px; font-size: 14.5px; }
.links a, .links button { color: var(--accent-ink); font-weight: 550; display: inline-flex; align-items: center; gap: 4px; }
.links a:hover, .links button:hover { text-decoration: underline; text-underline-offset: 3px; }
.empty { color: var(--ink-2); font-size: 15px; margin: 12px 0 0; }
.ov h2 { font: 400 23px/1.25 var(--paper); margin: 0 0 4px; text-wrap: balance; }
.ov .by { color: var(--ink-2); margin: 0 0 14px; }
.lede { color: var(--ink-2); margin: 0 0 20px; line-height: 1.6; }
.stack { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--line); margin: 0 0 12px; gap: 2px; }
.stack span { display: block; height: 100%; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 14.5px; }
.legend li { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; cursor: help; }
.legend .g { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; background: var(--good-wash); color: var(--good); }
.legend .g[data-tone="muted"] { background: var(--muted-wash); color: var(--muted); }
.legend .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; margin: 0; font-size: 14.5px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.facts code { font-size: 13px; }
details.more-box { margin-top: 18px; }
details.more-box summary { cursor: pointer; font: 600 15px/1.4 var(--sans); color: var(--ink); list-style: none; }
details.more-box summary::-webkit-details-marker { display: none; }
details.more-box summary::before { content: "+ "; }
details.more-box[open] summary::before { content: "\2212  "; }
.cited { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 12px; font-size: 14.5px; }
.cited a { font-weight: 600; }
.cited .src { color: var(--muted); font-size: 13.5px; display: block; }
.sec-list { list-style: none; margin: 0; padding: 0; }
.row-btn { width: 100%; text-align: left; display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start;
  padding: 9px 4px; border-bottom: 1px solid var(--line); }
.row-btn:hover b { color: var(--accent-ink); }
.row-btn .g { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; background: var(--good-wash); color: var(--good); margin-top: 1px; }
.row-btn .g[data-tone="muted"] { background: var(--muted-wash); color: var(--muted); }
.row-btn b { font-weight: 600; font-size: 14.5px; display: block; }
.row-btn span.t { color: var(--ink-2); font-size: 14.5px; }

/* Contents drawer ----------------------------------------------------- */
.toc { position: fixed; z-index: 40; left: 0; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); bottom: 0; width: min(380px, 90vw);
  background: var(--page); border-right: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column;
  transform: translateX(-102%); transition: transform .22s ease; visibility: hidden; }
.toc.open { transform: none; visibility: visible; }
.toc-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.toc-head input { width: 100%; font: 14px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 10px; padding: 9px 12px; }
.toc-head input:focus { outline: 2px solid var(--accent-wash-2); border-color: var(--accent); }
.toc-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.toc-count { font-size: 12.5px; color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 8px; font: 500 13.5px/1 var(--sans); color: var(--ink-2); flex: none;
  padding: 7px 10px; border-radius: 8px; white-space: nowrap; }
.switch:hover { background: var(--surface-2); color: var(--ink); }
.switch[aria-checked="true"] { color: var(--ink); }
.switch::before { content: ""; width: 26px; height: 15px; border-radius: 99px; background: var(--line-2); transition: background .15s;
  box-shadow: inset 0 0 0 2px var(--line-2); background-image: radial-gradient(circle at 7.5px 50%, var(--surface) 5px, transparent 5.5px); }
.switch[aria-checked="true"]::before { background-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent);
  background-image: radial-gradient(circle at 18.5px 50%, #fff 5px, transparent 5.5px); }
.toc-foot { display: flex; gap: 16px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); font-size: 13px; }
.toc-foot a { color: var(--ink-2); }
.toc-foot a:hover { color: var(--accent-ink); }
.toc-list { overflow-y: auto; flex: 1; padding: 8px 8px 40px; }
.toc-sec { display: flex; gap: 8px; width: 100%; text-align: left; padding: 7px 8px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.toc-sec.l2 { font-weight: 500; color: var(--ink-2); padding-left: 20px; }
.toc-sec.l3 { font-weight: 500; color: var(--ink-2); padding-left: 32px; font-size: 13px; }
.toc-sec .num { color: var(--accent-ink); font-variant-numeric: tabular-nums; flex: none; }
.toc-sec:hover, .toc-stmt:hover { background: var(--surface-2); }
.toc-stmt { display: grid; grid-template-columns: 18px auto 1fr; gap: 8px; width: 100%; text-align: left; align-items: baseline;
  padding: 5px 8px 5px 20px; border-radius: 8px; font-size: 13px; color: var(--ink-2); }
.toc-stmt .g { font-size: 11px; color: var(--good); text-align: center; }
.toc-stmt .g[data-tone="muted"] { color: var(--muted); }
.toc-stmt b { font-weight: 600; color: var(--ink); white-space: nowrap; }
.toc-stmt span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toc-stmt.is-current { background: var(--accent-wash); }
.toc-other { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.toc-other-head { font: 600 11px/1.4 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 4px 8px 6px; }
.toc-stmt.other { padding-left: 8px; }
.toc-empty { color: var(--muted); font-size: 13px; padding: 8px; margin: 0; }
.toc-stmt.is-current b { color: var(--accent-ink); }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgba(20, 20, 19, 0.28); opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }

/* Floating bits ---------------------------------------------------------- */
.peek { position: fixed; z-index: 60; width: min(560px, calc(100vw - 32px)); max-height: 46vh; overflow: auto; background: var(--surface);
  border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 18px 6px; font-family: var(--paper);
  font-size: 16px; line-height: 1.55; color: var(--ink); }
.peek .thm { margin: 0; padding: 0; background: none !important; box-shadow: none !important; }
.peek .lean-mark { display: none; }
.peek .eq { margin: 0.4em 0; }
.peek-label { font: 600 11px/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.back-btn { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 15; font: 550 13px/1 var(--sans);
  background: var(--ink); color: var(--page); padding: 10px 14px; border-radius: 999px; box-shadow: var(--shadow); }
.toast { position: fixed; z-index: 70; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--page); font: 550 13px/1 var(--sans); padding: 10px 14px; border-radius: 999px; transition: opacity .2s, transform .2s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

/* Narrow screens ---------------------------------------------------------- */
@media (max-width: 1100px) { #githubLink { display: none; } }
@media (max-width: 860px) {
  :root { --bar-h: 50px; }
  .bar { gap: 8px; padding: 0 8px; }
  .papers button { padding: 6px 9px; font-size: 13px; }
  #pdfLink { display: none; }
  .switch .long { display: none; }
  .switch { padding: 7px 6px; gap: 6px; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .splitter { display: none; }
  .paper-pane { padding-bottom: calc(var(--peek) + env(safe-area-inset-bottom, 0px)); }
  .doc { font-size: 17px; padding-top: 28px; }
  .lean-pane { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: min(80dvh, 720px);
    border-radius: 18px 18px 0 0; border-top: 1px solid var(--line-2); box-shadow: var(--shadow);
    transform: translateY(calc(100% - var(--peek) - env(safe-area-inset-bottom, 0px))); transition: transform .25s ease; }
  .lean-pane.open { transform: none; }
  .sheet-handle { display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--peek); padding: 8px 16px 8px; text-align: left; flex: none; position: relative; }
  .sheet-handle::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 4px; background: var(--line-2); }
  .sheet-handle .g { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; background: var(--good-wash); color: var(--good); flex: none; }
  .sheet-handle .g[data-tone="muted"] { background: var(--muted-wash); color: var(--muted); }
  .sheet-handle .txt { display: grid; min-width: 0; }
  .sheet-handle b { font: 600 14px/1.3 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-handle small { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-handle .chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
  .lean-pane.open .sheet-handle .chev { transform: rotate(180deg); }
  .panel { padding: 6px 18px 40px; }
  .back-btn { bottom: calc(var(--peek) + 16px); }
}

@media (max-width: 520px) { .papers .full { display: none; } .papers .brief { display: inline; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <button class="icon-btn" id="tocBtn" type="button" aria-label="Contents and search" aria-expanded="false" aria-controls="toc">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h8"/></svg>
    </button>
    <div class="papers" role="tablist" aria-label="Paper" id="paperTabs"></div>
    <button class="switch" id="stmtOnly" type="button" role="switch" aria-checked="false" aria-pressed="false" title="Show only the numbered statements (s)"><span>Statements<span class="long"> only</span></span></button>
    <div class="bar-end">
      <a class="bar-link" id="pdfLink" href="#" target="_blank" rel="noopener">PDF</a>
      <a class="bar-link" id="githubLink" href="#" target="_blank" rel="noopener">GitHub</a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch colour theme">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 0 0 13z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="progress" aria-hidden="true"><i id="progress"></i></div>
  </header>
  <div class="main">
    <main class="paper-pane" id="paperPane" tabindex="-1">
      <article class="doc" id="doc"></article>
      <button class="back-btn" id="backBtn" type="button" hidden></button>
    </main>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the Lean panel" tabindex="0"></div>
    <aside class="lean-pane" id="leanPane" aria-label="Lean formalization">
      <button class="sheet-handle" id="sheetHandle" type="button" aria-expanded="false"></button>
      <div class="lean-scroll" id="leanScroll"><div class="panel" id="panel"></div></div>
    </aside>
  </div>
</div>
<aside class="toc" id="toc" aria-label="Contents">
  <div class="toc-head">
    <input type="search" id="filter" placeholder="Find a statement, title or Lean name" autocomplete="off" aria-label="Find a statement, title or Lean name">
    <div class="toc-count" id="tocCount"></div>
  </div>
  <nav class="toc-list" id="tocList"></nav>
  <div class="toc-foot"><a href="checker.html">Statement checker</a><a id="readmeLink" href="#" target="_blank" rel="noopener">README</a></div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="peek" id="peek" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="data" type="application/json">@@DATA@@</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var $ = function (id) { return document.getElementById(id); };
  var doc = $("doc"), pane = $("paperPane"), panel = $("panel"), leanScroll = $("leanScroll");
  var narrow = window.matchMedia("(max-width: 860px)");
  var finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var ICON = {
    prev: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>',
    next: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg>',
    ext: '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5H3.5v9h9V10M9 3.5h3.5V7M12.5 3.5 7 9"/></svg>',
    pin: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h4M7 2.5v3.8L4.8 8.8v1h6.4v-1L9 6.3V2.5M8 9.8v3.7"/></svg>',
    copy: '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v6.5a1 1 0 0 0 1 1h.5"/></svg>',
    chev: '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10 8 5.5l4.5 4.5"/></svg>'
  };

  // ---- Data ---------------------------------------------------------------
  var byId = {};
  Object.keys(DATA.papers).forEach(function (key) {
    DATA.papers[key].statements.forEach(function (s, i) { s.paper = key; s.index = i; byId[s.id] = s; });
  });
  var state = { paper: null, view: null, selected: null, pinned: false, hold: null, back: [], positions: {} };
  $("githubLink").href = DATA.github;
  $("readmeLink").href = DATA.github + "#readme";

  function sourceUrl(d) {
    return DATA.github + "/blob/" + DATA.commit + "/" + d.path + "#L" + d.start + "-L" + d.end;
  }
  function tone(s) { return DATA.statuses[s.status].tone === "muted" ? "muted" : "good"; }
  function glyph(s) { return DATA.statuses[s.status].glyph; }
  function label(s) { return s.word + " " + s.number; }
  // The statement's title as the paper sets it (with math), else the coverage title.
  function titleHtml(s) { return s.title_html || esc(s.title); }

  // ---- Theme ----------------------------------------------------------------
  var root = document.documentElement;
  function effectiveDark() {
    return root.dataset.theme ? root.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  $("themeBtn").addEventListener("click", function () {
    var next = effectiveDark() ? "light" : "dark";
    root.dataset.theme = next;
    store.set("ci2zf-theme", next);
  });

  // ---- Math -----------------------------------------------------------------
  var mathQueue = [], mathTotal = 0, mathDone = 0;
  function katexOptions(display) {
    return {
      displayMode: display, throwOnError: false, strict: "ignore",
      macros: Object.assign({}, (DATA.papers[state.paper] || {}).macros || {}),
      trust: function (ctx) { return ctx.command === "\\href" && /^#/.test(ctx.url); }
    };
  }
  function renderMath(el) {
    if (!window.katex) return;
    var nodes = el.querySelectorAll ? el.querySelectorAll(".m:not(.katex-done), .md:not(.katex-done)") : [];
    for (var i = 0; i < nodes.length; i++) typeset(nodes[i]);
    if (el.classList && (el.classList.contains("m") || el.classList.contains("md")) && !el.classList.contains("katex-done")) typeset(el);
  }
  function typeset(node) {
    var src = node.getAttribute("data-src"), opts = katexOptions(node.classList.contains("md"));
    if (src !== null) opts.throwOnError = true;  // formulas found in notes: show the original text on failure
    try { katex.render(node.textContent, node, opts); }
    catch (e) { if (src !== null) { node.textContent = src; node.classList.add("m-raw"); } }
    node.classList.add("katex-done");
  }
  function scheduleMath() {
    // Typeset the chapter in view first, then the rest in document order.
    var chapters = Array.prototype.slice.call(doc.querySelectorAll(".chapter, .title-block"));
    var top = pane.scrollTop, first = 0;
    chapters.forEach(function (c, i) { if (c.offsetTop <= top + pane.clientHeight) first = i; });
    mathQueue = chapters.slice(first).concat(chapters.slice(0, first).reverse());
    mathTotal = mathQueue.length; mathDone = 0;
    pumpMath();
  }
  function pumpMath() {
    if (!mathQueue.length) { $("progress").style.width = "0"; return; }
    if (!window.katex) { setTimeout(pumpMath, 120); return; }
    var start = performance.now();
    while (mathQueue.length && performance.now() - start < 24) {
      var chapter = mathQueue.shift();
      var nodes = chapter.querySelectorAll(".m:not(.katex-done), .md:not(.katex-done)");
      var before = pane.scrollTop, anchor = null, anchorTop = 0;
      if (chapter.offsetTop + chapter.offsetHeight < before) {
        anchor = firstVisible(); anchorTop = anchor ? anchor.getBoundingClientRect().top : 0;
      }
      for (var i = 0; i < nodes.length; i++) typeset(nodes[i]);
      if (anchor) pane.scrollTop += anchor.getBoundingClientRect().top - anchorTop;
      mathDone++;
    }
    $("progress").style.width = mathQueue.length ? (100 * mathDone / mathTotal).toFixed(1) + "%" : "0";
    if (mathQueue.length) requestAnimationFrame(pumpMath); else { refreshFollow(); }
  }
  function firstVisible() {
    var items = doc.querySelectorAll(".chapter > *"), top = pane.getBoundingClientRect().top;
    for (var i = 0; i < items.length; i++) if (items[i].getBoundingClientRect().bottom > top) return items[i];
    return null;
  }
  function ensureTypesetUpTo(el) {
    var chapter = el.closest(".chapter");
    if (!chapter) return;
    var chapters = doc.querySelectorAll(".chapter");
    for (var i = 0; i < chapters.length; i++) {
      renderMath(chapters[i]);
      if (chapters[i] === chapter) break;
    }
  }

  // ---- Paper ------------------------------------------------------------------
  var tabs = $("paperTabs");
  Object.keys(DATA.papers).forEach(function (key) {
    var b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.dataset.paper = key;
    b.innerHTML = '<span class="full">' + esc(DATA.papers[key].short) + '</span><span class="brief">' + esc(DATA.papers[key].short.split(" ")[0]) + '</span>';
    b.addEventListener("click", function () { if (state.paper !== key) openPaper(key); });
    tabs.appendChild(b);
  });

  var sectionOf = {}, headings = [], thms = [];
  function openPaper(key, target) {
    if (state.paper) state.positions[state.paper] = pane.scrollTop;
    state.paper = key; state.selected = null; state.pinned = false; state.hold = null; state.view = null; state.back = [];
    var p = DATA.papers[key];
    Array.prototype.forEach.call(tabs.children, function (b) { b.setAttribute("aria-selected", String(b.dataset.paper === key)); });
    document.title = p.title;
    $("pdfLink").hidden = !p.pdf;
    if (p.pdf) $("pdfLink").href = p.pdf;
    doc.innerHTML = p.html || fallbackHtml(p);
    doc.classList.toggle("stmt-only", $("stmtOnly").getAttribute("aria-pressed") === "true");
    indexDoc(p);
    decorate();
    buildToc();
    $("backBtn").hidden = true;
    pane.scrollTop = 0;
    if (target) goTo(target, { select: true, instant: true });
    else if (state.positions[key]) pane.scrollTop = state.positions[key];
    scheduleMath();
    refreshFollow(true);
    if (!target) history.replaceState(null, "", "#" + key);
  }

    (bySection[""] || []).forEach(function (s) { out += stmtRow(s); });
    headings.forEach(function (h) {
      out += '<button class="toc-sec l' + h.level + '" type="button" data-go="' + esc(h.id) + '" data-sec>' + (h.num ? '<span class="num">' + esc(h.num) + '</span>' : "") + '<span>' + h.title + '</span></button>';
      (bySection[h.id] || []).forEach(function (s) { out += stmtRow(s); });
    });
    Object.keys(DATA.papers).forEach(function (key) {
      if (key === state.paper) return;
      out += '<div class="toc-other" data-other><div class="toc-other-head">In the ' + esc(DATA.papers[key].short.toLowerCase()) + '</div>';
      DATA.papers[key].statements.forEach(function (s) { out += stmtRow(s).replace('class="toc-stmt"', 'class="toc-stmt other"'); });
      out += '</div>';
    });
    out += '<p class="toc-empty" id="tocEmpty" hidden>No statement matches. Try a number such as 3.6, a word from a title, or part of a Lean name.</p>';
    $("tocList").innerHTML = out;
    renderMath($("tocList"));
    filterToc();
    markToc();
  }
  function markToc() {
    var id = state.view && state.view.type === "stmt" ? state.view.id : null;
    $("tocList").querySelectorAll(".toc-stmt").forEach(function (b) { b.classList.toggle("is-current", b.dataset.go === id); });
  }
  function filterToc() {
    var q = $("filter").value.trim().toLowerCase(), shown = 0, total = 0, other = 0;
    $("tocList").querySelectorAll(".toc-stmt").forEach(function (b) {
      var mine = !b.classList.contains("other");
      if (mine) total++;
      var hit = q ? q.split(/\s+/).every(function (w) { return b.dataset.search.indexOf(w) >= 0; }) : mine;
      b.hidden = !hit;
      if (hit && mine) shown++;
      if (hit && !mine) other++;
    });
    $("tocList").querySelectorAll(".toc-sec").forEach(function (b) { b.hidden = !!q; });
    $("tocList").querySelectorAll("[data-other]").forEach(function (g) { g.hidden = !other; });
    $("tocEmpty").hidden = !q || shown + other > 0;
    $("tocCount").textContent = q ? shown + " of " + total + " in this paper" + (other ? ", " + other + " in the other" : "")
      : total + " numbered statements";
  }
  $("filter").addEventListener("input", filterToc);
  $("filter").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var first = $("tocList").querySelector(".toc-stmt:not([hidden])");
      if (first) { first.click(); }
    }
  });
  function openToc(open) {
    $("toc").classList.toggle("open", open);
    $("scrim").classList.toggle("on", open);
    $("tocBtn").setAttribute("aria-expanded", String(open));
    if (open) { setTimeout(function () { var cur = $("tocList").querySelector(".is-current"); if (cur) cur.scrollIntoView({ block: "center" }); $("filter").focus({ preventScroll: true }); }, 60); }
  }
  $("tocBtn").addEventListener("click", function () { openToc(!$("toc").classList.contains("open")); });
  $("scrim").addEventListener("click", function () { openToc(false); });
  $("tocList").addEventListener("click", function (e) {
    var b = e.target.closest("[data-go]");
    if (!b) return;
    openToc(false);
    goTo(b.dataset.go, { select: !b.hasAttribute("data-sec"), remember: true, instant: true });
  });

  // ---- Previews of references ---------------------------------------------------
  var peek = $("peek"), peekTimer = null, peekFor = null;
  function hidePeek() { clearTimeout(peekTimer); peek.hidden = true; peekFor = null; }
  doc.addEventListener("mouseover", function (e) {
    if (!finePointer.matches) return;
    var a = e.target.closest("a[href^='#']");
    if (!a || a === peekFor) return;
    clearTimeout(peekTimer);
    peekTimer = setTimeout(function () { showPeek(a); }, 280);
  });
  doc.addEventListener("mouseout", function (e) {
    var a = e.target.closest("a[href^='#']");
    if (a && !a.contains(e.relatedTarget) && !peek.contains(e.relatedTarget)) { clearTimeout(peekTimer); setTimeout(function () { if (!peek.matches(":hover")) hidePeek(); }, 160); }
  });
  peek.addEventListener("mouseleave", hidePeek);
  function showPeek(a) {
    var id = decodeURIComponent(a.getAttribute("href").slice(1)), el = document.getElementById(id);
    if (!el) return;
    var box = el.closest(".thm, .eq, li, .float, h2.h, h3.h, h4.h") || el;
    if (box.classList.contains("anchor")) box = box.parentElement;
    renderMath(box);
    var clone = box.cloneNode(true);
    clone.removeAttribute("id");
    clone.querySelectorAll("[id]").forEach(function (n) { n.removeAttribute("id"); });
    clone.classList.remove("is-current", "is-selected", "flash");
    var what = box.classList.contains("thm") ? "" : box.classList.contains("eq") ? "Equation" : box.closest(".bib") ? "Reference" : box.classList.contains("float") ? "" : box.classList.contains("h") ? "Section" : "";
    peek.innerHTML = (what ? '<div class="peek-label">' + what + '</div>' : "");
    if (box.classList.contains("h")) {
      var info = headings.filter(function (h) { return h.el === box; })[0];
      peek.innerHTML += '<div><b>' + (info && info.num ? esc(info.num) + " " : "") + '</b>' + (info ? info.title : "") + '</div>';
    } else peek.appendChild(clone);
    peek.hidden = false; peekFor = a;
    var r = a.getBoundingClientRect(), w = peek.offsetWidth, h = peek.offsetHeight;
    var left = Math.min(Math.max(12, r.left - 40), window.innerWidth - w - 12);
    var top = r.bottom + 8;
    if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 8);
    peek.style.left = left + "px"; peek.style.top = top + "px";
  }

  // ---- Splitter ---------------------------------------------------------------------
  (function () {
    var saved = parseInt(store.get("ci2zf-lean-w"), 10);
    if (saved > 300) root.style.setProperty("--lean-w", saved + "px");
    var sp = $("splitter"), dragging = false;
    function setW(x) {
      var w = Math.round(Math.min(Math.max(window.innerWidth - x, 320), window.innerWidth * 0.62));
      root.style.setProperty("--lean-w", w + "px");
      return w;
    }
    sp.addEventListener("pointerdown", function (e) { dragging = true; sp.classList.add("dragging"); sp.setPointerCapture(e.pointerId); e.preventDefault(); });
    sp.addEventListener("pointermove", function (e) { if (dragging) setW(e.clientX); });
    sp.addEventListener("pointerup", function (e) {
      if (!dragging) return;
      dragging = false; sp.classList.remove("dragging");
      store.set("ci2zf-lean-w", String(setW(e.clientX)));
    });
    sp.addEventListener("keydown", function (e) {
      var cur = parseInt(getComputedStyle(root).getPropertyValue("--lean-w"), 10) || 460;
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        var w = setW(window.innerWidth - cur + (e.key === "ArrowLeft" ? -24 : 24));
        store.set("ci2zf-lean-w", String(w)); e.preventDefault();
      }
    });
  })();

  // ---- Toggles and keys -------------------------------------------------------------
  $("stmtOnly").addEventListener("click", function () {
    var on = this.getAttribute("aria-pressed") !== "true";
    this.setAttribute("aria-pressed", String(on));
    this.setAttribute("aria-checked", String(on));
    var keep = state.view && state.view.type === "stmt" ? targetEl(state.view.id) : null;
    doc.classList.toggle("stmt-only", on);
    if (keep) scrollToEl(keep, true);
    refreshFollow(true);
  });

  document.addEventListener("keydown", function (e) {
    if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) {
      if (e.key === "Escape") openToc(false);
      return;
    }
    var list = DATA.papers[state.paper].statements;
    var cur = state.view && state.view.type === "stmt" ? byId[state.view.id] : null;
    if (e.key === "j" || e.key === "k") {
      var next = cur ? list[cur.index + (e.key === "j" ? 1 : -1)] : list[0];
      if (next) goTo(next.id, { select: true });
      e.preventDefault();
    } else if (e.key === "/") { openToc(true); e.preventDefault(); }
    else if (e.key === "s") { $("stmtOnly").click(); }
    else if (e.key === "Escape") { openToc(false); hidePeek(); openSheet(false); }
    else if (e.key === "p" && cur) { state.pinned = !state.pinned; show(state.view, true); }
  });

  window.addEventListener("hashchange", function () { route(); });
  function route() {
    var id = decodeURIComponent(location.hash.slice(1));
    if (DATA.papers[id]) { if (state.paper !== id) openPaper(id); return; }
    if (byId[id]) { if (byId[id].paper !== state.paper) openPaper(byId[id].paper, id); else goTo(id, { select: true, instant: true }); return; }
    if (!state.paper) openPaper(DATA.default);
    if (id && document.getElementById(id)) goTo(id, { instant: true });
  }

  document.addEventListener("DOMContentLoaded", function () { route(); });
  if (document.readyState !== "loading") route();
  window.addEventListener("load", function () { if (mathQueue.length) pumpMath(); });
})();
</script>
</body>
</html>
